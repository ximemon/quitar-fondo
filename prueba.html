<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XimCut – Prueba GrabCut</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fffafb;
  color:#292629;
}

.contenedor{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:50px 20px;
  text-align:center;
}

.logo{
  font-size:44px;
  font-weight:800;
  letter-spacing:-2px;
}

.logo span{color:#e88ba7}

.subtitulo{
  color:#777;
  margin:8px 0 35px;
}

.zona{
  background:#fff;
  border:2px dashed #edc6d1;
  border-radius:22px;
  padding:60px 25px;
  box-shadow:0 8px 30px rgba(190,120,145,.08);
}

.zona h2{margin-top:0}

.zona p{
  color:#777;
  line-height:1.6;
}

button{
  border:0;
  border-radius:11px;
  padding:14px 24px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  background:#e88ba7;
  color:#fff;
}

#archivo{display:none}

#procesando,
#resultado{
  display:none;
}

#procesando{
  background:#fff;
  border-radius:22px;
  padding:55px 25px;
}

.spinner{
  width:52px;
  height:52px;
  margin:0 auto 20px;
  border:5px solid #f5dce3;
  border-top-color:#e88ba7;
  border-radius:50%;
  animation:girar .7s linear infinite;
}

@keyframes girar{
  to{transform:rotate(360deg)}
}

.resultado-card{
  background:#fff;
  border-radius:22px;
  padding:35px;
  box-shadow:0 8px 30px rgba(190,120,145,.08);
}

.checker{
  max-width:600px;
  margin:25px auto;

  background-color:#fff;

  background-image:
  linear-gradient(45deg,#f3e7eb 25%,transparent 25%),
  linear-gradient(-45deg,#f3e7eb 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#f3e7eb 75%),
  linear-gradient(-45deg,transparent 75%,#f3e7eb 75%);

  background-size:24px 24px;

  background-position:
  0 0,
  0 12px,
  12px -12px,
  -12px 0;

  border-radius:14px;
  overflow:hidden;
}

#salida{
  max-width:100%;
  max-height:600px;
  display:block;
  margin:auto;
}

.secundario{
  background:#f7e9ed;
  color:#8f5366;
  margin-left:8px;
}

#error{
  color:#b00020;
  margin-top:18px;
}

.aviso{
  margin-top:18px;
  font-size:13px;
  color:#999;
}
</style>
</head>

<body>

<main class="contenedor">

<div class="logo">
Xim<span>Cut</span>
</div>

<div class="subtitulo">
Prueba de nuevo motor
</div>


<section id="inicio" class="zona">

<h2>Probemos el Uriage 👀</h2>

<p>
Pegá la imagen con <strong>Ctrl + V</strong><br>
o elegila desde tu computadora.
</p>

<button onclick="archivo.click()">
Elegir imagen
</button>

<input
id="archivo"
type="file"
accept="image/*"
>

<div class="aviso" id="estadoOpenCV">
Preparando motor...
</div>

</section>


<section id="procesando">

<div class="spinner"></div>

<h2>Procesando...</h2>

<p id="detalle">
Analizando producto y fondo.
</p>

</section>


<section id="resultado">

<div class="resultado-card">

<h2>Resultado de prueba</h2>

<div class="checker">
<canvas id="salida"></canvas>
</div>

<button id="descargar">
Descargar prueba
</button>

<button
class="secundario"
id="otra"
>
Probar otra
</button>

<div id="error"></div>

</div>

</section>

</main>


<script>

let cvListo = false;
let procesandoAhora = false;

const inicio =
document.getElementById("inicio");

const procesando =
document.getElementById("procesando");

const resultado =
document.getElementById("resultado");

const archivo =
document.getElementById("archivo");

const salida =
document.getElementById("salida");

const error =
document.getElementById("error");

const estadoOpenCV =
document.getElementById("estadoOpenCV");


function esperarOpenCV(){

  if(
    typeof cv !== "undefined" &&
    cv.Mat
  ){

    cvListo = true;

    estadoOpenCV.textContent =
    "✓ Motor listo";

    return;
  }

  setTimeout(
    esperarOpenCV,
    200
  );
}

esperarOpenCV();


async function procesar(file){

  if(!file) return;

  if(!cvListo){

    alert(
      "El motor todavía se está preparando. Esperá unos segundos."
    );

    return;
  }

  if(procesandoAhora) return;

  procesandoAhora = true;

  inicio.style.display = "none";
  resultado.style.display = "none";
  procesando.style.display = "block";

  try{

    const bitmap =
    await createImageBitmap(file);

    /*
      Trabajamos a una resolución máxima
      razonable para mantener buena velocidad.
    */

    const maximo = 900;

    const escala =
    Math.min(
      maximo / bitmap.width,
      maximo / bitmap.height,
      1
    );

    const ancho =
    Math.round(
      bitmap.width * escala
    );

    const alto =
    Math.round(
      bitmap.height * escala
    );


    const temporal =
    document.createElement("canvas");

    temporal.width = ancho;
    temporal.height = alto;

    const tctx =
    temporal.getContext("2d");

    tctx.drawImage(
      bitmap,
      0,
      0,
      ancho,
      alto
    );

    bitmap.close();


    let src =
    cv.imread(temporal);

    /*
      GrabCut necesita RGB.
    */

    let rgb =
    new cv.Mat();

    cv.cvtColor(
      src,
      rgb,
      cv.COLOR_RGBA2RGB
    );


    let mascara =
    new cv.Mat(
      rgb.rows,
      rgb.cols,
      cv.CV_8UC1,
      new cv.Scalar(
        cv.GC_BGD
      )
    );


    /*
      En vez de asumir simplemente
      "todo el centro es producto",
      marcamos un borde exterior
      como fondo seguro.
    */

    const margen =
    Math.max(
      3,
      Math.round(
        Math.min(
          ancho,
          alto
        ) * 0.025
      )
    );


    /*
      Zona central:
      posible primer plano.
    */

    const rect =
    new cv.Rect(
      margen,
      margen,
      ancho - margen * 2,
      alto - margen * 2
    );


    let bgdModel =
    new cv.Mat();

    let fgdModel =
    new cv.Mat();


    /*
      5 iteraciones suele dar
      un equilibrio razonable
      entre calidad y velocidad.
    */

    cv.grabCut(
      rgb,
      mascara,
      rect,
      bgdModel,
      fgdModel,
      5,
      cv.GC_INIT_WITH_RECT
    );


    /*
      Creamos PNG transparente.
    */

    const original =
    tctx.getImageData(
      0,
      0,
      ancho,
      alto
    );

    const pixeles =
    original.data;

    const maskData =
    mascara.data;


    for(
      let i = 0;
      i < maskData.length;
      i++
    ){

      const clase =
      maskData[i];

      /*
        GC_FGD = primer plano seguro
        GC_PR_FGD = primer plano probable

        Ambos se conservan.
      */

      const conservar =
      (
        clase === cv.GC_FGD ||
        clase === cv.GC_PR_FGD
      );


      pixeles[
        i * 4 + 3
      ] =
      conservar
      ? 255
      : 0;

    }


    salida.width = ancho;
    salida.height = alto;

    const sctx =
    salida.getContext("2d");

    sctx.putImageData(
      original,
      0,
      0
    );


    src.delete();
    rgb.delete();
    mascara.delete();
    bgdModel.delete();
    fgdModel.delete();


    procesando.style.display =
    "none";

    resultado.style.display =
    "block";

  }

  catch(e){

    console.error(e);

    procesando.style.display =
    "none";

    inicio.style.display =
    "block";

    error.textContent =
    "La prueba no pudo procesar esta imagen.";

  }

  finally{

    procesandoAhora = false;

  }

}


/* CTRL + V */

document.addEventListener(
"paste",
function(event){

  const items =
  event.clipboardData?.items;

  if(!items) return;

  for(const item of items){

    if(
      item.type.startsWith(
        "image/"
      )
    ){

      procesar(
        item.getAsFile()
      );

      break;

    }

  }

});


/* ARCHIVO */

archivo.addEventListener(
"change",
function(){

  if(
    archivo.files.length
  ){

    procesar(
      archivo.files[0]
    );

  }

});


/* DESCARGAR */

document
.getElementById("descargar")
.addEventListener(
"click",
function(){

  salida.toBlob(
  function(blob){

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = url;

    a.download =
    "prueba-ximcut.png";

    a.click();

    setTimeout(
      () =>
      URL.revokeObjectURL(url),
      1000
    );

  },
  "image/png"
  );

});


/* OTRA */

document
.getElementById("otra")
.addEventListener(
"click",
function(){

  resultado.style.display =
  "none";

  inicio.style.display =
  "block";

  archivo.value = "";

});

</script>


<!-- OpenCV.js oficial -->
<script
async
src="https://docs.opencv.org/4.x/opencv.js"
></script>

</body>
</html>
