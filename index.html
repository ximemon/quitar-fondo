
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XimCut</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e88ba7'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='42' fill='white' font-family='Arial'%3EX%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
body{font:16px Arial;color:#302b2e;background:#fffafb;margin:0}
main{max-width:850px;margin:auto;padding:48px 20px;text-align:center}
h1{font-size:48px;margin:0;letter-spacing:-2px}
h1 span{color:#e88ba7}
p{color:#777;line-height:1.6}
.panel{background:white;border-radius:22px;padding:36px;box-shadow:0 8px 30px #be789116}
#start{border:2px dashed #edc6d1;padding:65px 20px}
button{border:0;border-radius:10px;background:#e88ba7;color:white;padding:14px 22px;font-weight:bold;cursor:pointer;margin:5px}
button.secondary{background:#f7e9ed;color:#865064}
button:disabled{opacity:.5;cursor:wait}
input{padding:14px;border:1px solid #edc6d1;border-radius:10px;font-size:16px;width:min(100%,400px)}
#preview{background:repeating-conic-gradient(#eee 0% 25%,white 0% 50%) 50%/20px 20px;border-radius:12px}
#out{max-width:100%;max-height:480px;display:block;margin:auto}
#last img{max-width:130px;max-height:130px}
#error{color:#a32242;white-space:pre-wrap;overflow-wrap:anywhere}
[hidden]{display:none!important}
.spinner{width:45px;height:45px;border:4px solid #f5dce3;border-top-color:#e88ba7;border-radius:50%;margin:0 auto 20px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
<h1>Xim<span>Cut</span></h1>
<p>Pegá una imagen y obtenela sin fondo.</p>

<section id="start" class="panel">
<h2>Pegá una imagen</h2>
<p>Ctrl + V o arrastrá una imagen hasta acá.</p>
<button id="choose">Elegir imagen</button>
<input type="file" id="file" accept="image/*" hidden>
</section>

<section id="busy" class="panel" hidden>
<div class="spinner"></div>
<h2>Eliminando fondo...</h2>
<p id="status"></p>
</section>

<section id="result" class="panel" hidden>
<div id="preview"><img id="out" alt="Imagen sin fondo"></div>
<p id="elapsed"></p>
<input id="code" placeholder="Código del producto" autocomplete="off">
<div>
<button id="copy">Copiar imagen</button>
<button id="save">Descargar PNG</button>
<button id="reset" class="secondary">Otra imagen</button>
</div>
</section>

<p id="error" role="alert"></p>

<button id="folder" class="secondary">Elegir carpeta de destino</button>
<p id="folderStatus">Destino deseado: H:\Marketing\_Diseño\_Base de Datos</p>

<section id="last" hidden>
<p>Última descarga</p>
<img id="thumb" alt="Última descarga">
<p id="lastName"></p>
</section>
</main>

<script type="module">
const $ = id => document.getElementById(id);

let engine;
let blob;
let url;
let working = false;
let saving = false;
let folderHandle = null;

function show(id){
  for(const x of ['start','busy','result']){
    $(x).hidden = x !== id;
  }
  $('last').hidden =
    id !== 'start' || !$('thumb').getAttribute('src');
}

function reset(){
  if(url) URL.revokeObjectURL(url);
  url = null;
  blob = null;
  $('code').value = '';
  $('file').value = '';
  $('out').removeAttribute('src');
  $('save').textContent = 'Descargar PNG';
  $('error').textContent = '';
  show('start');
}

async function load(){
  if(engine) return engine;

  const {pipeline,env} = await import(
    'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2'
  );

  env.allowLocalModels = false;

  const progress_callback = p => {
    if(p.status === 'progress'){
      $('status').textContent =
        'Preparando modelo: ' +
        Math.round(p.progress || 0) + '%';
    }
  };

  try{
    if(navigator.gpu){
      engine = await pipeline(
        'background-removal',
        'onnx-community/BiRefNet-ONNX',
        {
          device:'webgpu',
          dtype:'fp32',
          progress_callback
        }
      );
      return engine;
    }
  }catch(e){
    console.warn(e);
  }

  $('status').textContent =
    'Preparando modo compatible (CPU)...';

  engine = await pipeline(
    'background-removal',
    'onnx-community/BiRefNet-ONNX',
    {
      device:'wasm',
      dtype:'fp32',
      progress_callback
    }
  );

  return engine;
}

async function process(f){
  if(!f || working || saving ||
     !f.type.startsWith('image/')) return;

  working = true;
  reset();
  show('busy');

  $('status').textContent =
    'Cargando IA. La primera vez puede tardar varios minutos.';

  let src;
  const t = performance.now();

  try{
    const pipe = await load();

    $('status').textContent = 'Procesando imagen...';

    src = URL.createObjectURL(f);

    const images = await pipe(src);
    const raw = images[0];
    const canvas = raw.toCanvas();

    blob = await new Promise((resolve,reject)=>{
      canvas.toBlob(
        b => b ? resolve(b) :
        reject(new Error('No se pudo generar PNG')),
        'image/png'
      );
    });

    url = URL.createObjectURL(blob);
    $('out').src = url;

    $('elapsed').textContent =
      ((performance.now()-t)/1000).toFixed(1)+' s';

    show('result');
    $('code').focus();

  }catch(e){
    console.error(e);
    show('start');
    $('error').textContent =
      'No se pudo procesar: '+(e.message || String(e));

  }finally{
    if(src) URL.revokeObjectURL(src);
    working = false;
  }
}

const dbPromise = new Promise((resolve,reject)=>{
  const r = indexedDB.open('ximcut-destination',1);

  r.onupgradeneeded = () =>
    r.result.createObjectStore('settings');

  r.onsuccess = () => resolve(r.result);
  r.onerror = () => reject(r.error);
});

async function folderStore(value){
  const db = await dbPromise;

  return new Promise((resolve,reject)=>{
    const tx = db.transaction(
      'settings',
      value ? 'readwrite' : 'readonly'
    );

    const store = tx.objectStore('settings');

    const r = value ?
      store.put(value,'folder') :
      store.get('folder');

    tx.oncomplete = () => resolve(r.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

function showFolder(){
  if(folderHandle){
    $('folderStatus').textContent =
      'Carpeta seleccionada: '+folderHandle.name;
  }
}

folderStore().then(h=>{
  if(!folderHandle){
    folderHandle = h;
    showFolder();
  }
}).catch(()=>{});

async function chooseFolder(){
  if(!window.showDirectoryPicker){
    throw new Error(
      'Abrí XimCut en Chrome desde GitHub Pages.'
    );
  }

  folderHandle = await window.showDirectoryPicker({
    mode:'readwrite',
    id:'ximcut-destination'
  });

  showFolder();
  folderStore(folderHandle).catch(()=>{});

  return folderHandle;
}

$('folder').onclick = async()=>{
  try{
    await chooseFolder();
    $('error').textContent = '';
  }catch(e){
    if(e.name !== 'AbortError'){
      $('error').textContent = e.message;
    }
  }
};

$('choose').onclick = () => $('file').click();

$('file').onchange = e =>
  process(e.target.files[0]);

document.addEventListener('paste',e=>{
  const f = [...(e.clipboardData?.items || [])]
    .find(i=>i.type.startsWith('image/'))
    ?.getAsFile();

  if(f){
    e.preventDefault();
    process(f);
  }
});

$('start').ondragover = e => e.preventDefault();

$('start').ondrop = e=>{
  e.preventDefault();
  process(e.dataTransfer.files[0]);
};

$('reset').onclick = ()=>{
  if(!saving) reset();
};

$('code').oninput = ()=>{
  const c = $('code').value.trim();

  $('save').textContent =
    c ? 'Descargar '+c+'.png' : 'Descargar PNG';
};

$('code').onkeydown = e=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    $('save').click();
  }
};

$('copy').onclick = async()=>{
  if(!blob) return;

  try{
    await navigator.clipboard.write([
      new ClipboardItem({'image/png':blob})
    ]);

    $('copy').textContent = 'Copiada';

    setTimeout(()=>{
      $('copy').textContent = 'Copiar imagen';
    },1000);

  }catch(e){
    $('error').textContent =
      'No se pudo copiar. Descargá el PNG.';
  }
};

$('save').onclick = async()=>{
  if(!blob || saving) return;

  const c = $('code').value.trim();

  if(!c){
    $('error').textContent = 'Ingresá el código.';
    $('code').focus();
    return;
  }

  const name =
    c.replace(/[\\/:*?"<>|]/g,'_')+'.png';

  const b = blob;

  saving = true;
  $('save').disabled = true;
  $('error').textContent = '';

  try{
    const h = folderHandle || await chooseFolder();

    if(await h.requestPermission({
      mode:'readwrite'
    }) !== 'granted'){
      throw new Error(
        'Autorizá el acceso a la carpeta.'
      );
    }

    let exists = false;

    try{
      await h.getFileHandle(name);
      exists = true;
    }catch(e){
      if(e.name !== 'NotFoundError') throw e;
    }

    if(exists &&
       !confirm('Ya existe '+name+'. ¿Reemplazarlo?')){
      return;
    }

    const f = await h.getFileHandle(
      name,
      {create:true}
    );

    const w = await f.createWritable();

    try{
      await w.write(b);
      await w.close();
    }catch(e){
      await w.abort().catch(()=>{});
      throw e;
    }

    reset();

  }catch(e){
    $('error').textContent =
      e.name === 'AbortError' ?
      'Guardado cancelado.' :
      'No se pudo guardar: '+e.message;

    return;

  }finally{
    saving = false;
    $('save').disabled = false;
  }

  try{
    const im = await createImageBitmap(b);
    const cv = document.createElement('canvas');

    const s = Math.min(
      140/im.width,
      140/im.height,
      1
    );

    cv.width = Math.max(1,Math.round(im.width*s));
    cv.height = Math.max(1,Math.round(im.height*s));

    cv.getContext('2d').drawImage(
      im,0,0,cv.width,cv.height
    );

    im.close();

    const data = cv.toDataURL();

    $('thumb').src = data;
    $('lastName').textContent = name;

    localStorage.setItem(
      'ximcut_ultima_imagen',data
    );

    localStorage.setItem(
      'ximcut_ultimo_codigo',name
    );

    if(!$('start').hidden){
      $('last').hidden = false;
    }

  }catch(e){
    console.warn(e);
  }
};

try{
  const d = localStorage.getItem(
    'ximcut_ultima_imagen'
  );

  if(d){
    $('thumb').src = d;

    $('lastName').textContent =
      localStorage.getItem('ximcut_ultimo_codigo');

    $('last').hidden = false;
  }

  localStorage.removeItem('ximcut_removebg_key');

}catch(e){}
</script>
</body>
</html>
