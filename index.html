<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quitar fondo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f7f8;
  color: #222;
}

.contenedor {
  width: 100%;
  max-width: 950px;
  margin: auto;
  padding: 55px 20px;
  text-align: center;
}

h1 {
  font-size: 48px;
  margin: 0 0 8px;
}

.subtitulo {
  color: #666;
  font-size: 18px;
  margin-bottom: 35px;
}

/* ZONA INICIAL */

.zona {
  background: white;
  border: 2px dashed #ccc;
  border-radius: 22px;
  padding: 65px 30px;
  box-shadow: 0 8px 30px rgba(0,0,0,.06);
  transition: .2s;
}

.zona.arrastrando {
  border-color: #111;
  transform: scale(1.01);
}

.icono {
  font-size: 55px;
  margin-bottom: 15px;
}

.zona h2 {
  font-size: 27px;
  margin: 0 0 10px;
}

.zona p {
  color: #777;
  line-height: 1.5;
}

button {
  border: 0;
  border-radius: 11px;
  padding: 14px 24px;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
}

.boton-principal {
  background: #222;
  color: white;
}

.boton-principal:hover {
  background: #444;
}

#archivo {
  display: none;
}


/* PROCESANDO */

#procesando {
  display: none;
  background: white;
  border-radius: 22px;
  padding: 55px 30px;
  box-shadow: 0 8px 30px rgba(0,0,0,.06);
}

.preview-proceso {
  position: relative;
  display: inline-block;
  max-width: 500px;
  margin-bottom: 25px;
}

.preview-proceso img {
  max-width: 100%;
  max-height: 430px;
  display: block;
  border-radius: 12px;
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,.70);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.spinner {
  width: 55px;
  height: 55px;
  border: 6px solid #ddd;
  border-top-color: #222;
  border-radius: 50%;
  animation: girar .8s linear infinite;
}

@keyframes girar {
  to { transform: rotate(360deg); }
}

#estado {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
}

#detalle {
  color: #777;
  font-size: 14px;
}

.barra {
  width: 100%;
  max-width: 450px;
  height: 7px;
  background: #eee;
  border-radius: 20px;
  margin: 20px auto 0;
  overflow: hidden;
}

#progreso {
  height: 100%;
  width: 5%;
  background: #222;
  transition: width .3s ease;
}


/* RESULTADO */

#resultado {
  display: none;
}

.resultado-card {
  background: white;
  border-radius: 22px;
  padding: 35px;
  box-shadow: 0 8px 30px rgba(0,0,0,.06);
}

.checker {
  max-width: 600px;
  margin: auto;

  background-color: white;
  background-image:
    linear-gradient(45deg, #ddd 25%, transparent 25%),
    linear-gradient(-45deg, #ddd 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #ddd 75%),
    linear-gradient(-45deg, transparent 75%, #ddd 75%);

  background-size: 24px 24px;
  background-position:
    0 0,
    0 12px,
    12px -12px,
    -12px 0px;

  border-radius: 14px;
  overflow: hidden;
}

#imagenResultado {
  max-width: 100%;
  max-height: 550px;
  display: block;
  margin: auto;
}

.acciones {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 25px;
}

.copiar {
  background: #222;
  color: white;
}

.descargar {
  background: #e9e9e9;
  color: #222;
}

.nueva {
  background: transparent;
  color: #555;
  border: 1px solid #ccc;
}

.error {
  color: #b00020;
  margin-top: 18px;
  font-size: 14px;
}

</style>
</head>


<body>

<main class="contenedor">

<h1>Quitar fondo</h1>

<div class="subtitulo">
  Pegá una imagen y obtenela sin fondo.
</div>


<!-- PANTALLA INICIAL -->

<section id="inicio" class="zona">

  <div class="icono">🖼️</div>

  <h2>Pegá una imagen</h2>

  <p>
    Copiá una imagen y presioná <strong>Ctrl + V</strong><br>
    o arrastrala hasta acá.
  </p>

  <button
    class="boton-principal"
    onclick="document.getElementById('archivo').click()">
    Elegir imagen
  </button>

  <input
    type="file"
    id="archivo"
    accept="image/png,image/jpeg,image/webp">

</section>



<!-- PANTALLA DE PROCESAMIENTO -->

<section id="procesando">

  <div class="preview-proceso">

    <img id="imagenOriginal">

    <div class="overlay">
      <div class="spinner"></div>
    </div>

  </div>

  <div id="estado">
    Eliminando fondo...
  </div>

  <div id="detalle">
    Preparando el modelo de inteligencia artificial.
  </div>

  <div class="barra">
    <div id="progreso"></div>
  </div>

</section>



<!-- RESULTADO -->

<section id="resultado">

  <div class="resultado-card">

    <h2>¡Fondo eliminado!</h2>

    <div class="checker">
      <img id="imagenResultado">
    </div>

    <div class="acciones">

      <button class="copiar" id="copiar">
        Copiar imagen
      </button>

      <button class="descargar" id="descargar">
        Descargar PNG
      </button>

      <button class="nueva" id="nueva">
        Nueva imagen
      </button>

    </div>

    <div id="mensajeError" class="error"></div>

  </div>

</section>

</main>



<script type="module">

import { removeBackground } from
"https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";


const inicio = document.getElementById("inicio");
const procesando = document.getElementById("procesando");
const resultado = document.getElementById("resultado");

const archivo = document.getElementById("archivo");

const imagenOriginal =
document.getElementById("imagenOriginal");

const imagenResultado =
document.getElementById("imagenResultado");

const estado =
document.getElementById("estado");

const detalle =
document.getElementById("detalle");

const progreso =
document.getElementById("progreso");

const copiar =
document.getElementById("copiar");

const descargar =
document.getElementById("descargar");

const nueva =
document.getElementById("nueva");

const mensajeError =
document.getElementById("mensajeError");


let blobResultado = null;
let urlOriginal = null;
let urlResultado = null;



async function procesarImagen(file) {

  if (!file || !file.type.startsWith("image/")) {
    return;
  }


  /* MOSTRAR IMAGEN ORIGINAL */

  if (urlOriginal) {
    URL.revokeObjectURL(urlOriginal);
  }

  urlOriginal = URL.createObjectURL(file);

  imagenOriginal.src = urlOriginal;


  inicio.style.display = "none";
  resultado.style.display = "none";
  procesando.style.display = "block";

  progreso.style.width = "5%";

  estado.textContent = "Eliminando fondo...";

  detalle.textContent =
  "Preparando la inteligencia artificial.";


  try {

    const config = {

      output: {
        format: "image/png",
        quality: 1
      },

      progress: function(key, current, total) {

        let porcentaje = 10;

        if (total && total > 0) {
          porcentaje =
          Math.round((current / total) * 90);
        }

        porcentaje =
        Math.max(5, Math.min(95, porcentaje));

        progreso.style.width =
        porcentaje + "%";


        if (key.includes("fetch")) {

          detalle.textContent =
          "Cargando el modelo de inteligencia artificial...";

        }

        else if (key.includes("inference")) {

          detalle.textContent =
          "Detectando el objeto principal...";

        }

        else if (key.includes("mask")) {

          detalle.textContent =
          "Separando el fondo...";

        }

        else if (key.includes("encode")) {

          detalle.textContent =
          "Preparando tu PNG transparente...";

        }

      }

    };


    blobResultado =
    await removeBackground(file, config);


    progreso.style.width = "100%";

    detalle.textContent =
    "¡Listo!";


    if (urlResultado) {
      URL.revokeObjectURL(urlResultado);
    }

    urlResultado =
    URL.createObjectURL(blobResultado);

    imagenResultado.src =
    urlResultado;


    setTimeout(function() {

      procesando.style.display = "none";
      resultado.style.display = "block";

    }, 350);


  }

  catch (error) {

    console.error(error);

    estado.textContent =
    "No pudimos procesar esta imagen.";

    detalle.textContent =
    "Probá nuevamente con una imagen JPG, PNG o WEBP.";

    progreso.style.width = "0%";

  }

}



/* CTRL + V */

document.addEventListener(
"paste",
function(event) {

  const items =
  event.clipboardData?.items;

  if (!items) return;


  for (const item of items) {

    if (item.type.startsWith("image/")) {

      const file =
      item.getAsFile();

      procesarImagen(file);

      break;

    }

  }

});



/* ELEGIR ARCHIVO */

archivo.addEventListener(
"change",
function() {

  if (archivo.files.length > 0) {

    procesarImagen(
      archivo.files[0]
    );

  }

});



/* ARRASTRAR */

inicio.addEventListener(
"dragover",
function(event) {

  event.preventDefault();

  inicio.classList.add(
    "arrastrando"
  );

});


inicio.addEventListener(
"dragleave",
function() {

  inicio.classList.remove(
    "arrastrando"
  );

});


inicio.addEventListener(
"drop",
function(event) {

  event.preventDefault();

  inicio.classList.remove(
    "arrastrando"
  );

  const file =
  event.dataTransfer.files[0];

  procesarImagen(file);

});



/* DESCARGAR PNG */

descargar.addEventListener(
"click",
function() {

  if (!blobResultado) return;

  const enlace =
  document.createElement("a");

  enlace.href =
  URL.createObjectURL(blobResultado);

  enlace.download =
  "imagen-sin-fondo.png";

  enlace.click();

  setTimeout(
    () => URL.revokeObjectURL(enlace.href),
    1000
  );

});



/* COPIAR PNG */

copiar.addEventListener(
"click",
async function() {

  mensajeError.textContent = "";

  if (!blobResultado) return;


  try {

    const pngBlob =
    new Blob(
      [await blobResultado.arrayBuffer()],
      { type: "image/png" }
    );


    await navigator.clipboard.write([
      new ClipboardItem({
        "image/png": pngBlob
      })
    ]);


    copiar.textContent =
    "✓ Copiada";


    setTimeout(function() {

      copiar.textContent =
      "Copiar imagen";

    }, 1600);


  }

  catch (error) {

    console.error(error);

    mensajeError.textContent =
    "Tu navegador bloqueó la copia automática. Podés usar Descargar PNG.";

  }

});



/* NUEVA IMAGEN */

nueva.addEventListener(
"click",
function() {

  resultado.style.display =
  "none";

  procesando.style.display =
  "none";

  inicio.style.display =
  "block";

  archivo.value = "";

  blobResultado = null;

  progreso.style.width =
  "5%";

  mensajeError.textContent =
  "";

});

</script>

</body>
</html>
