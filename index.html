<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XimCut</title>

<link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<rect width='100' height='100' rx='24' fill='%23e88ba7'/>
<text x='50' y='69' text-anchor='middle'
font-family='Arial' font-size='58' font-weight='700'
fill='white'>X</text>
</svg>">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #fffafb;
  color: #292629;
}

.contenedor {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 55px 20px;
  text-align: center;
}

.logo {
  font-size: 46px;
  font-weight: 800;
  letter-spacing: -2px;
  margin-bottom: 8px;
}

.logo span {
  color: #e88ba7;
}

.subtitulo {
  color: #777;
  font-size: 17px;
  margin-bottom: 35px;
}

/* INICIO */

.zona {
  background: #fff;
  border: 2px dashed #edc6d1;
  border-radius: 22px;
  padding: 65px 30px;
  box-shadow: 0 8px 30px rgba(190,120,145,.08);
  transition: .2s;
}

.zona.arrastrando {
  border-color: #e88ba7;
  background: #fff7f9;
  transform: scale(1.01);
}

.icono {
  font-size: 48px;
  margin-bottom: 15px;
}

.zona h2 {
  font-size: 26px;
  margin: 0 0 10px;
}

.zona p {
  color: #777;
  line-height: 1.6;
  margin-bottom: 24px;
}

button {
  border: 0;
  border-radius: 11px;
  padding: 14px 24px;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: .2s;
}

.boton-principal {
  background: #e88ba7;
  color: white;
}

.boton-principal:hover {
  background: #df7899;
}

#archivo {
  display: none;
}

/* PROCESANDO */

#procesando {
  display: none;
  background: white;
  border-radius: 22px;
  padding: 55px 30px;
  box-shadow: 0 8px 30px rgba(190,120,145,.08);
}

.spinner {
  width: 55px;
  height: 55px;
  margin: 0 auto 25px;
  border: 5px solid #f5dce3;
  border-top-color: #e88ba7;
  border-radius: 50%;
  animation: girar .7s linear infinite;
}

@keyframes girar {
  to { transform: rotate(360deg); }
}

#estado {
  font-size: 21px;
  font-weight: 700;
  margin-bottom: 8px;
}

#detalle {
  color: #888;
  font-size: 14px;
}

/* RESULTADO */

#resultado {
  display: none;
}

.resultado-card {
  background: white;
  border-radius: 22px;
  padding: 35px;
  box-shadow: 0 8px 30px rgba(190,120,145,.08);
}

.resultado-card h2 {
  margin-top: 0;
  margin-bottom: 25px;
}

.checker {
  max-width: 560px;
  margin: auto;
  background-color: white;

  background-image:
    linear-gradient(45deg,#f3e7eb 25%,transparent 25%),
    linear-gradient(-45deg,#f3e7eb 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#f3e7eb 75%),
    linear-gradient(-45deg,transparent 75%,#f3e7eb 75%);

  background-size: 24px 24px;
  background-position:
    0 0,
    0 12px,
    12px -12px,
    -12px 0;

  border-radius: 14px;
  overflow: hidden;
}

#imagenResultado {
  max-width: 100%;
  max-height: 520px;
  display: block;
  margin: auto;
}

/* CÓDIGO */

.codigo-area {
  max-width: 420px;
  margin: 28px auto 0;
  text-align: left;
}

.codigo-area label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
}

#codigo {
  width: 100%;
  padding: 14px 15px;
  border: 1px solid #e4d5da;
  border-radius: 10px;
  font-size: 17px;
  outline: none;
  background: white;
}

#codigo:focus {
  border-color: #e88ba7;
  box-shadow: 0 0 0 3px rgba(232,139,167,.12);
}

.acciones {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 22px;
}

.copiar {
  background: #e88ba7;
  color: white;
}

.copiar:hover {
  background: #df7899;
}

.descargar {
  background: #f7e9ed;
  color: #8f5366;
}

.descargar:hover {
  background: #f2dce3;
}

.nueva {
  background: transparent;
  color: #777;
  border: 1px solid #ddd;
}

.nueva:hover {
  background: #fafafa;
}

.error {
  color: #b00020;
  margin-top: 18px;
  font-size: 14px;
}

/* ÚLTIMA DESCARGA */

#ultimaDescarga {
  display: none;
  margin: 28px auto 0;
  max-width: 220px;
}

.ultima-titulo {
  font-size: 13px;
  color: #999;
  margin-bottom: 10px;
}

.ultima-card {
  background: white;
  border: 1px solid #f0e2e7;
  border-radius: 15px;
  padding: 12px;
  box-shadow: 0 5px 18px rgba(190,120,145,.06);
}

.ultima-preview {
  width: 100%;
  height: 125px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;

  background-color: white;

  background-image:
    linear-gradient(45deg,#f7eef1 25%,transparent 25%),
    linear-gradient(-45deg,#f7eef1 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#f7eef1 75%),
    linear-gradient(-45deg,transparent 75%,#f7eef1 75%);

  background-size: 18px 18px;
  background-position:
    0 0,
    0 9px,
    9px -9px,
    -9px 0;
}

#ultimaImagen {
  max-width: 100%;
  max-height: 115px;
}

#ultimoCodigo {
  margin-top: 10px;
  font-size: 14px;
  font-weight: 600;
  color: #555;
}

@media (max-width:600px) {
  .contenedor {
    padding: 35px 15px;
  }

  .logo {
    font-size: 39px;
  }

  .zona {
    padding: 50px 20px;
  }

  .resultado-card {
    padding: 25px 18px;
  }
}
</style>
</head>

<body>

<main class="contenedor">

  <div class="logo">
    Xim<span>Cut</span>
  </div>

  <div class="subtitulo">
    Pegá una imagen y obtenela sin fondo.
  </div>

  <section id="inicio" class="zona">

    <div class="icono">🖼️</div>

    <h2>Pegá una imagen</h2>

    <p>
      Copiá una imagen y presioná
      <strong>Ctrl + V</strong><br>
      o arrastrala hasta acá.
    </p>

    <button
      class="boton-principal"
      onclick="document.getElementById('archivo').click()"
    >
      Elegir imagen
    </button>

    <input
      type="file"
      id="archivo"
      accept="image/png,image/jpeg,image/webp"
    >

  </section>

  <section id="ultimaDescarga">

    <div class="ultima-titulo">
      Última descarga
    </div>

    <div class="ultima-card">

      <div class="ultima-preview">
        <img id="ultimaImagen">
      </div>

      <div id="ultimoCodigo"></div>

    </div>

  </section>

  <section id="procesando">

    <div class="spinner"></div>

    <div id="estado">
      Eliminando fondo...
    </div>

    <div id="detalle">
      Detectando el fondo blanco.
    </div>

  </section>

  <section id="resultado">

    <div class="resultado-card">

      <h2>¡Listo!</h2>

      <div class="checker">
        <img id="imagenResultado">
      </div>

      <div class="codigo-area">

        <label for="codigo">
          Código del producto
        </label>

        <input
          id="codigo"
          type="text"
          autocomplete="off"
          placeholder="Ej. 110755"
        >

      </div>

      <div class="acciones">

        <button class="copiar" id="copiar">
          Copiar imagen
        </button>

        <button class="descargar" id="descargar">
          Descargar PNG
        </button>

        <button class="nueva" id="nueva">
          Procesar otra imagen
        </button>

      </div>

      <div
        id="mensajeError"
        class="error"
      ></div>

    </div>

  </section>

</main>


<script>

const inicio =
  document.getElementById("inicio");

const procesando =
  document.getElementById("procesando");

const resultado =
  document.getElementById("resultado");

const archivo =
  document.getElementById("archivo");

const imagenResultado =
  document.getElementById("imagenResultado");

const copiar =
  document.getElementById("copiar");

const descargar =
  document.getElementById("descargar");

const nueva =
  document.getElementById("nueva");

const codigo =
  document.getElementById("codigo");

const mensajeError =
  document.getElementById("mensajeError");

const ultimaDescarga =
  document.getElementById("ultimaDescarga");

const ultimaImagen =
  document.getElementById("ultimaImagen");

const ultimoCodigo =
  document.getElementById("ultimoCodigo");


let blobResultado = null;
let urlResultado = null;
let procesandoAhora = false;


/* =========================================
   NUEVO MOTOR XIMCUT
   Elimina únicamente el fondo claro
   conectado con los bordes de la imagen.
   ========================================= */

async function quitarFondoBlanco(file) {

  const bitmap =
    await createImageBitmap(file);

  const canvas =
    document.createElement("canvas");

  canvas.width = bitmap.width;
  canvas.height = bitmap.height;

  const ctx =
    canvas.getContext(
      "2d",
      { willReadFrequently: true }
    );

  ctx.drawImage(bitmap, 0, 0);

  bitmap.close();

  const imagen =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const data = imagen.data;

  const ancho = canvas.width;
  const alto = canvas.height;

  const total = ancho * alto;

  const visitado =
    new Uint8Array(total);

  /*
    Umbral conservador:
    solo consideramos fondo los tonos
    realmente muy cercanos al blanco.
  */

  function esFondo(indice) {

    const p = indice * 4;

    const r = data[p];
    const g = data[p + 1];
    const b = data[p + 2];

    const minimo =
      Math.min(r, g, b);

    const maximo =
      Math.max(r, g, b);

    /*
      Debe ser muy claro y prácticamente
      neutro. Esto evita comerse colores
      pastel como la mancha verde del Uriage.
    */

    return (
      minimo >= 242 &&
      (maximo - minimo) <= 15
    );

  }


  /*
    Empezamos únicamente desde los bordes.

    Así un blanco que esté DENTRO del producto
    no desaparece.

    Solo desaparece el blanco exterior que
    tiene conexión con el borde de la foto.
  */

  const cola =
    new Int32Array(total);

  let inicioCola = 0;
  let finCola = 0;


  function agregar(indice) {

    if (
      indice < 0 ||
      indice >= total ||
      visitado[indice]
    ) {
      return;
    }

    if (!esFondo(indice)) {
      return;
    }

    visitado[indice] = 1;

    cola[finCola++] = indice;

  }


  /* BORDE SUPERIOR E INFERIOR */

  for (let x = 0; x < ancho; x++) {

    agregar(x);

    agregar(
      (alto - 1) * ancho + x
    );

  }


  /* BORDE IZQUIERDO Y DERECHO */

  for (let y = 0; y < alto; y++) {

    agregar(y * ancho);

    agregar(
      y * ancho + ancho - 1
    );

  }


  /* FLOOD FILL */

  while (inicioCola < finCola) {

    const indice =
      cola[inicioCola++];

    const x =
      indice % ancho;

    const y =
      Math.floor(indice / ancho);


    if (x > 0)
      agregar(indice - 1);

    if (x < ancho - 1)
      agregar(indice + 1);

    if (y > 0)
      agregar(indice - ancho);

    if (y < alto - 1)
      agregar(indice + ancho);

  }


  /*
    Convertimos solamente esa zona
    exterior en transparente.
  */

  for (
    let i = 0;
    i < total;
    i++
  ) {

    if (visitado[i]) {

      data[i * 4 + 3] = 0;

    }

  }


  /*
    Suavizado muy pequeño del borde.

    Busca evitar el halo blanco típico
    sin comerse el producto.
  */

  const alphaOriginal =
    new Uint8ClampedArray(total);

  for (
    let i = 0;
    i < total;
    i++
  ) {

    alphaOriginal[i] =
      data[i * 4 + 3];

  }


  for (
    let y = 1;
    y < alto - 1;
    y++
  ) {

    for (
      let x = 1;
      x < ancho - 1;
      x++
    ) {

      const i =
        y * ancho + x;

      if (alphaOriginal[i] === 0)
        continue;


      const tocaTransparente =
        alphaOriginal[i - 1] === 0 ||
        alphaOriginal[i + 1] === 0 ||
        alphaOriginal[i - ancho] === 0 ||
        alphaOriginal[i + ancho] === 0;


      if (tocaTransparente) {

        const p = i * 4;

        const r = data[p];
        const g = data[p + 1];
        const b = data[p + 2];

        const minimo =
          Math.min(r, g, b);

        const maximo =
          Math.max(r, g, b);


        /*
          Solamente suavizamos píxeles
          extremadamente claros del borde.
        */

        if (
          minimo > 235 &&
          (maximo - minimo) < 22
        ) {

          const oscuridad =
            255 - minimo;

          const alpha =
            Math.max(
              35,
              Math.min(
                255,
                oscuridad * 14
              )
            );

          data[p + 3] = alpha;

        }

      }

    }

  }


  ctx.putImageData(
    imagen,
    0,
    0
  );


  return new Promise(
    function(resolve, reject) {

      canvas.toBlob(
        function(blob) {

          if (blob) {
            resolve(blob);
          }
          else {
            reject(
              new Error(
                "No se pudo crear el PNG."
              )
            );
          }

        },
        "image/png"
      );

    }
  );

}


/* PROCESAR */

async function procesarImagen(file) {

  if (
    !file ||
    !file.type.startsWith("image/")
  ) {
    return;
  }

  if (procesandoAhora) {
    return;
  }


  procesandoAhora = true;

  mensajeError.textContent = "";

  inicio.style.display = "none";
  ultimaDescarga.style.display = "none";
  resultado.style.display = "none";
  procesando.style.display = "block";


  try {

    /*
      Damos un instante al navegador
      para mostrar la pantalla de proceso.
    */

    await new Promise(
      resolve =>
        setTimeout(resolve, 30)
    );


    blobResultado =
      await quitarFondoBlanco(file);


    if (urlResultado) {

      URL.revokeObjectURL(
        urlResultado
      );

    }


    urlResultado =
      URL.createObjectURL(
        blobResultado
      );


    imagenResultado.src =
      urlResultado;


    procesando.style.display =
      "none";

    resultado.style.display =
      "block";

    codigo.focus();

  }

  catch(error) {

    console.error(error);

    procesando.style.display =
      "none";

    inicio.style.display =
      "block";

    mensajeError.textContent =
      "No pudimos procesar esta imagen.";

  }

  finally {

    procesandoAhora = false;

  }

}


/* PEGAR CTRL + V */

document.addEventListener(
  "paste",
  function(event) {

    const items =
      event.clipboardData?.items;

    if (!items) return;


    for (const item of items) {

      if (
        item.type.startsWith("image/")
      ) {

        const file =
          item.getAsFile();

        procesarImagen(file);

        break;

      }

    }

  }
);


/* ELEGIR ARCHIVO */

archivo.addEventListener(
  "change",
  function() {

    if (
      archivo.files.length > 0
    ) {

      procesarImagen(
        archivo.files[0]
      );

    }

  }
);


/* ARRASTRAR */

inicio.addEventListener(
  "dragover",
  function(event) {

    event.preventDefault();

    inicio.classList.add(
      "arrastrando"
    );

  }
);


inicio.addEventListener(
  "dragleave",
  function() {

    inicio.classList.remove(
      "arrastrando"
    );

  }
);


inicio.addEventListener(
  "drop",
  function(event) {

    event.preventDefault();

    inicio.classList.remove(
      "arrastrando"
    );

    const file =
      event.dataTransfer.files[0];

    procesarImagen(file);

  }
);


/* CÓDIGO */

codigo.addEventListener(
  "input",
  actualizarNombreDescarga
);


function actualizarNombreDescarga() {

  const valor =
    codigo.value.trim();

  descargar.textContent =
    valor
      ? "Descargar " +
        valor +
        ".png"
      : "Descargar PNG";

}


/* CREAR MINIATURA */

async function crearMiniatura(blob) {

  const bitmap =
    await createImageBitmap(blob);

  const max = 180;

  const escala =
    Math.min(
      max / bitmap.width,
      max / bitmap.height,
      1
    );

  const canvas =
    document.createElement("canvas");

  canvas.width =
    Math.max(
      1,
      Math.round(
        bitmap.width * escala
      )
    );

  canvas.height =
    Math.max(
      1,
      Math.round(
        bitmap.height * escala
      )
    );

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    bitmap,
    0,
    0,
    canvas.width,
    canvas.height
  );

  bitmap.close();

  /*
    WebP mantiene transparencia
    y ocupa mucho menos espacio.
  */

  return canvas.toDataURL(
    "image/webp",
    .82
  );

}


/* ÚLTIMA DESCARGA */

async function guardarUltimaDescarga(
  blob,
  nombre
) {

  try {

    const miniatura =
      await crearMiniatura(blob);

    localStorage.setItem(
      "ximcut_ultima_imagen",
      miniatura
    );

    localStorage.setItem(
      "ximcut_ultimo_codigo",
      nombre
    );

    mostrarUltimaDescarga(
      miniatura,
      nombre
    );

  }

  catch(error) {

    console.log(
      "No se pudo guardar la miniatura.",
      error
    );

  }

}


function mostrarUltimaDescarga(
  imagen,
  nombre
) {

  if (!imagen || !nombre) {
    return;
  }

  ultimaImagen.src =
    imagen;

  ultimoCodigo.textContent =
    nombre;

  ultimaDescarga.style.display =
    "block";

}


function cargarUltimaDescarga() {

  const imagen =
    localStorage.getItem(
      "ximcut_ultima_imagen"
    );

  const nombre =
    localStorage.getItem(
      "ximcut_ultimo_codigo"
    );

  if (imagen && nombre) {

    mostrarUltimaDescarga(
      imagen,
      nombre
    );

  }

}

cargarUltimaDescarga();


/* DESCARGAR */

async function descargarImagen() {

  if (!blobResultado) {
    return;
  }


  const valor =
    codigo.value.trim();


  if (!valor) {

    mensajeError.textContent =
      "Ingresá el código del producto antes de descargar.";

    codigo.focus();

    return;

  }


  mensajeError.textContent = "";

  const nombre =
    valor + ".png";


  /*
    Guardamos la miniatura ANTES
    de limpiar el resultado.
  */

  await guardarUltimaDescarga(
    blobResultado,
    nombre
  );


  const url =
    URL.createObjectURL(
      blobResultado
    );

  const enlace =
    document.createElement("a");

  enlace.href = url;
  enlace.download = nombre;

  document.body.appendChild(enlace);

  enlace.click();

  enlace.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(url);

      reiniciar();

    },
    150
  );

}


descargar.addEventListener(
  "click",
  descargarImagen
);


/* ENTER = DESCARGAR */

codigo.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      descargarImagen();

    }

  }
);


/* COPIAR */

copiar.addEventListener(
  "click",
  async function() {

    mensajeError.textContent = "";

    if (!blobResultado) {
      return;
    }


    try {

      const pngBlob =
        new Blob(
          [
            await blobResultado
              .arrayBuffer()
          ],
          {
            type: "image/png"
          }
        );


      await navigator.clipboard.write(
        [
          new ClipboardItem({
            "image/png": pngBlob
          })
        ]
      );


      copiar.textContent =
        "✓ Copiada";


      setTimeout(
        function() {

          copiar.textContent =
            "Copiar imagen";

        },
        1200
      );

    }

    catch(error) {

      console.error(error);

      mensajeError.textContent =
        "Chrome bloqueó la copia automática. Podés descargar el PNG.";

    }

  }
);


/* REINICIAR */

function reiniciar() {

  resultado.style.display =
    "none";

  procesando.style.display =
    "none";

  inicio.style.display =
    "block";

  archivo.value = "";

  codigo.value = "";

  blobResultado = null;

  mensajeError.textContent = "";

  descargar.textContent =
    "Descargar PNG";


  if (urlResultado) {

    URL.revokeObjectURL(
      urlResultado
    );

    urlResultado = null;

  }


  const imagen =
    localStorage.getItem(
      "ximcut_ultima_imagen"
    );

  const nombre =
    localStorage.getItem(
      "ximcut_ultimo_codigo"
    );


  if (imagen && nombre) {

    mostrarUltimaDescarga(
      imagen,
      nombre
    );

  }

}


nueva.addEventListener(
  "click",
  reiniciar
);

</script>

</body>
</html>
