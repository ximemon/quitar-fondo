<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XimCut – IA</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fffafb;
  color:#292629;
}

.contenedor{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:55px 20px;
  text-align:center;
}

.logo{
  font-size:46px;
  font-weight:800;
  letter-spacing:-2px;
  margin-bottom:8px;
}

.logo span{color:#e88ba7}

.subtitulo{
  color:#777;
  font-size:17px;
  margin-bottom:35px;
}

.zona,
#procesando,
.resultado-card{
  background:white;
  border-radius:22px;
  padding:55px 30px;
  box-shadow:0 8px 30px rgba(190,120,145,.08);
}

.zona{
  border:2px dashed #edc6d1;
}

.zona h2{margin-top:0}

.zona p{
  color:#777;
  line-height:1.6;
}

button{
  border:0;
  border-radius:11px;
  padding:14px 24px;
  font-size:16px;
  cursor:pointer;
  font-weight:600;
}

.principal{
  background:#e88ba7;
  color:white;
}

.secundario{
  background:#f7e9ed;
  color:#8f5366;
}

#archivo{display:none}

#procesando,
#resultado{
  display:none;
}

.spinner{
  width:55px;
  height:55px;
  margin:0 auto 25px;
  border:5px solid #f5dce3;
  border-top-color:#e88ba7;
  border-radius:50%;
  animation:girar .7s linear infinite;
}

@keyframes girar{
  to{transform:rotate(360deg)}
}

#estado{
  font-size:21px;
  font-weight:700;
}

#detalle{
  margin-top:10px;
  color:#888;
}

#tiempo{
  margin-top:12px;
  font-size:14px;
  color:#e88ba7;
  font-weight:600;
}

.checker{
  max-width:600px;
  margin:25px auto;

  background-color:white;

  background-image:
  linear-gradient(45deg,#f3e7eb 25%,transparent 25%),
  linear-gradient(-45deg,#f3e7eb 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#f3e7eb 75%),
  linear-gradient(-45deg,transparent 75%,#f3e7eb 75%);

  background-size:24px 24px;

  background-position:
  0 0,
  0 12px,
  12px -12px,
  -12px 0;

  border-radius:14px;
  overflow:hidden;
}

#imagenResultado{
  max-width:100%;
  max-height:600px;
  display:block;
  margin:auto;
}

.acciones{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

#motor{
  margin-top:18px;
  font-size:13px;
  color:#999;
}

#error{
  color:#b00020;
  margin-top:18px;
}
</style>
</head>

<body>

<main class="contenedor">

<div class="logo">
Xim<span>Cut</span>
</div>

<div class="subtitulo">
Prueba IA – precisión + velocidad
</div>


<section id="inicio" class="zona">

<h2>Pegá una imagen</h2>

<p>
Copiá la imagen del producto y presioná
<strong>Ctrl + V</strong>.
</p>

<button
class="principal"
onclick="archivo.click()"
>
Elegir imagen
</button>

<input
id="archivo"
type="file"
accept="image/*"
>

<div id="motor">
Preparando IA...
</div>

</section>


<section id="procesando">

<div class="spinner"></div>

<div id="estado">
Quitando fondo...
</div>

<div id="detalle">
La IA está identificando el producto.
</div>

<div id="tiempo">
0.0 s
</div>

</section>


<section id="resultado">

<div class="resultado-card">

<h2>¡Listo!</h2>

<div class="checker">
<img id="imagenResultado">
</div>

<div id="tiempoFinal"></div>

<div class="acciones">

<button
class="principal"
id="descargar"
>
Descargar prueba
</button>

<button
class="secundario"
id="otra"
>
Probar otra
</button>

</div>

<div id="error"></div>

</div>

</section>

</main>


<script type="module">

import {
  removeBackground,
  preload
}
from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";


const inicio =
document.getElementById("inicio");

const procesando =
document.getElementById("procesando");

const resultado =
document.getElementById("resultado");

const archivo =
document.getElementById("archivo");

const imagenResultado =
document.getElementById("imagenResultado");

const motor =
document.getElementById("motor");

const tiempo =
document.getElementById("tiempo");

const tiempoFinal =
document.getElementById("tiempoFinal");

const error =
document.getElementById("error");


let blobResultado = null;
let urlResultado = null;
let trabajando = false;
let intervalo = null;


/* ===============================
   CONFIGURACIÓN
   =============================== */

const config = {

  device:"gpu",

  model:"isnet_fp16",

  proxyToWorker:true,

  debug:false,

  output:{
    format:"image/png",
    quality:1,
    type:"foreground"
  },

  progress:function(key,current,total){

    if(
      key.includes("fetch") &&
      total > 0
    ){

      const porcentaje =
      Math.round(
        current / total * 100
      );

      motor.textContent =
      "Preparando IA: " +
      porcentaje +
      "%";

    }

  }

};


/* ===============================
   PRECARGAR
   =============================== */

async function prepararMotor(){

  try{

    motor.textContent =
    "Preparando IA...";

    await preload(config);

    motor.textContent =
    "✓ IA lista";

  }

  catch(e){

    console.error(e);

    motor.textContent =
    "La IA se cargará al pegar la imagen.";

  }

}

prepararMotor();


/* ===============================
   PROCESAR
   =============================== */

async function procesar(file){

  if(!file) return;

  if(trabajando) return;

  trabajando = true;

  error.textContent = "";

  inicio.style.display =
  "none";

  resultado.style.display =
  "none";

  procesando.style.display =
  "block";


  const comienzo =
  performance.now();


  intervalo =
  setInterval(function(){

    const segundos =
    (
      (
        performance.now() -
        comienzo
      ) / 1000
    ).toFixed(1);

    tiempo.textContent =
    segundos + " s";

  },100);


  try{

    blobResultado =
    await removeBackground(
      file,
      config
    );


    clearInterval(intervalo);


    const segundos =
    (
      (
        performance.now() -
        comienzo
      ) / 1000
    ).toFixed(1);


    if(urlResultado){

      URL.revokeObjectURL(
        urlResultado
      );

    }


    urlResultado =
    URL.createObjectURL(
      blobResultado
    );


    imagenResultado.src =
    urlResultado;


    tiempoFinal.textContent =
    "Procesada en " +
    segundos +
    " segundos";


    procesando.style.display =
    "none";

    resultado.style.display =
    "block";

  }

  catch(e){

    clearInterval(intervalo);

    console.error(e);

    procesando.style.display =
    "none";

    inicio.style.display =
    "block";

    error.textContent =
    "No se pudo procesar la imagen.";

  }

  finally{

    trabajando = false;

  }

}


/* ===============================
   CTRL + V
   =============================== */

document.addEventListener(
"paste",
function(event){

  const items =
  event.clipboardData?.items;

  if(!items) return;


  for(const item of items){

    if(
      item.type.startsWith(
        "image/"
      )
    ){

      const file =
      item.getAsFile();

      procesar(file);

      break;

    }

  }

});


/* ===============================
   ELEGIR ARCHIVO
   =============================== */

archivo.addEventListener(
"change",
function(){

  if(
    archivo.files.length
  ){

    procesar(
      archivo.files[0]
    );

  }

});


/* ===============================
   DESCARGAR
   =============================== */

document
.getElementById("descargar")
.addEventListener(
"click",
function(){

  if(!blobResultado) return;

  const url =
  URL.createObjectURL(
    blobResultado
  );

  const a =
  document.createElement("a");

  a.href = url;

  a.download =
  "prueba-ximcut.png";

  a.click();

  setTimeout(
    () =>
    URL.revokeObjectURL(url),
    1000
  );

});


/* ===============================
   OTRA
   =============================== */

document
.getElementById("otra")
.addEventListener(
"click",
function(){

  resultado.style.display =
  "none";

  inicio.style.display =
  "block";

  archivo.value = "";

  blobResultado = null;

});

</script>

</body>
</html>
